<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 560' width='900' height='560' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering='geometricPrecision'>
<rect width="900" height="560" fill="#F2EFE7"/>
<text x="450.0" y="34" fill="#11110F" font-size="18" font-weight="700" text-anchor="middle" style="">SCALE-UP AND SCALE-OUT ARE NOT ONE BANDWIDTH NUMBER</text>
<text x="450.0" y="56" fill="#5A5953" font-size="12" font-weight="400" text-anchor="middle" style="">SOURCE SPEC + UNIT CONVERSION — vendor rates; not application-level all-to-all throughput</text>
<line x1="376.4272793100338" y1="140" x2="376.4272793100338" y2="400" stroke="#C9C3B7" stroke-width="0.7" opacity="1"/>
<line x1="534.0664762906764" y1="140" x2="534.0664762906764" y2="400" stroke="#C9C3B7" stroke-width="0.7" opacity="1"/>
<text x="534.0664762906764" y="418" fill="#5A5953" font-size="10.5" font-weight="400" text-anchor="middle" style="">50 GB/s</text>
<line x1="604.2874326308158" y1="140" x2="604.2874326308158" y2="400" stroke="#C9C3B7" stroke-width="0.7" opacity="1"/>
<text x="604.2874326308158" y="418" fill="#5A5953" font-size="10.5" font-weight="400" text-anchor="middle" style="">100 GB/s</text>
<line x1="675.0108746072988" y1="140" x2="675.0108746072988" y2="400" stroke="#C9C3B7" stroke-width="0.7" opacity="1"/>
<line x1="745.98837262675" y1="140" x2="745.98837262675" y2="400" stroke="#C9C3B7" stroke-width="0.7" opacity="1"/>
<text x="745.98837262675" y="418" fill="#5A5953" font-size="10.5" font-weight="400" text-anchor="middle" style="">400 GB/s</text>
<line x1="787.5718126690102" y1="140" x2="787.5718126690102" y2="400" stroke="#C9C3B7" stroke-width="0.7" opacity="1"/>
<line x1="829.1837005656041" y1="140" x2="829.1837005656041" y2="400" stroke="#C9C3B7" stroke-width="0.7" opacity="1"/>
<text x="829.1837005656041" y="418" fill="#5A5953" font-size="10.5" font-weight="400" text-anchor="middle" style="">900 GB/s</text>
<text x="485.0" y="444" fill="#11110F" font-size="13" font-weight="600" text-anchor="middle" style="">Nominal bandwidth (GB/s, log scale)</text>
<text x="118" y="194.0" fill="#11110F" font-size="12" font-weight="600" text-anchor="end" style="">H100 SXM NVLink</text>
<rect x="130" y="160" width="699.1837005656041" height="60" fill="#5A5953" stroke="none" stroke-width="0" rx="2" ry="2" opacity="0.85"/>
<text x="839.1837005656041" y="194.0" fill="#11110F" font-size="11.5" font-weight="700" text-anchor="start" style="">900 GB/s → 900 GB/s nominal</text>
<text x="839.1837005656041" y="210.0" fill="#5A5953" font-size="10" font-weight="400" text-anchor="start" style="">Per-GPU interconnect specification; not all-to-all application bandwidth.</text>
<text x="118" y="274.0" fill="#11110F" font-size="12" font-weight="600" text-anchor="end" style="">ConnectX-7 NDR</text>
<rect x="130" y="240" width="404.0664762906764" height="60" fill="#2F5BFF" stroke="none" stroke-width="0" rx="2" ry="2" opacity="0.85"/>
<text x="544.0664762906764" y="274.0" fill="#11110F" font-size="11.5" font-weight="700" text-anchor="start" style="">400 Gb/s → 50 GB/s nominal</text>
<text x="544.0664762906764" y="290.0" fill="#5A5953" font-size="10" font-weight="400" text-anchor="start" style="">Nominal port rate; protocol/topology/contention reduce useful payload bandwidth.</text>
<text x="118" y="354.0" fill="#11110F" font-size="12" font-weight="600" text-anchor="end" style="">ConnectX-8</text>
<rect x="130" y="320" width="474.28743263081583" height="60" fill="#5A5953" stroke="none" stroke-width="0" rx="2" ry="2" opacity="0.85"/>
<text x="614.2874326308158" y="354.0" fill="#11110F" font-size="11.5" font-weight="700" text-anchor="start" style="">800 Gb/s → 100 GB/s nominal</text>
<text x="614.2874326308158" y="370.0" fill="#5A5953" font-size="10" font-weight="400" text-anchor="start" style="">Nominal throughput; not an application collective measurement.</text>
<line x1="130" y1="230" x2="840" y2="230" stroke="#11110F" stroke-width="0.8" stroke-dasharray="2,3" opacity="1"/>
<text x="118" y="234" fill="#11110F" font-size="10.5" font-weight="600" text-anchor="end" style="">scale-up</text>
<text x="118" y="274" fill="#11110F" font-size="10.5" font-weight="600" text-anchor="end" style="">scale-out</text>
<text x="485.0" y="90" fill="#11110F" font-size="12" font-weight="700" text-anchor="middle" style="">These numbers are NOT interchangeable application-level all-to-all throughputs.</text>
<text x="485.0" y="110" fill="#5A5953" font-size="11" font-weight="400" text-anchor="middle" style="">Vendor spec → nominal /8 conversion → sustainable fabric bandwidth → application all-to-all are different numbers.</text>
<text x="130" y="540" fill="#5A5953" font-size="10.5" font-weight="400" text-anchor="start" style="">Sources: NVIDIA H100 SXM NVLink (900 GB/s interconnect spec); NVIDIA ConnectX-7 (400 Gb/s) and ConnectX-8 (800 Gb/s) adapter specs. Bit/s → byte/s conversion is unit-only.</text>
</svg>